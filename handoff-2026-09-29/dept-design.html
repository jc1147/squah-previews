    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},k,b(DATA));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  function remember(pw){try{sessionStorage.setItem(KEY,pw);}catch(_){}}
  var saved=null;try{saved=sessionStorage.getItem(KEY);}catch(_){}
  if(saved){unlock(saved).then(show).catch(function(){try{sessionStorage.removeItem(KEY);}catch(_){}});}
  document.getElementById("g").addEventListener("submit",function(ev){
    ev.preventDefault();
    var e=document.getElementById("e"),pw=document.getElementById("pw").value;e.textContent="Checking...";
    unlock(pw).then(function(html){remember(pw);show(html);}).catch(function(){ e.textContent="Wrong password."; });
  });
})();
</script>
